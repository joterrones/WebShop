<footer class="border-t-4 border-[#E30613] bg-black text-white">
  <div class="mx-auto max-w-screen-xl px-4 py-10 md:py-12">
    <div
      class="flex flex-col items-center gap-8 text-center md:flex-row md:items-start md:justify-between md:text-left"
    >
      <div class="flex max-w-sm flex-col items-center gap-2 md:items-start">
        <p class="text-lg font-extrabold tracking-[0.18em] text-white">ALABA</p>
        <p
          class="text-base italic text-[#E30613]"
          style="font-family: Georgia, 'Times New Roman', serif"
        >
          Sport
        </p>
        <p class="mt-2 text-sm text-white/70">
          Equipamiento deportivo con identidad. Envíos a todo el Perú.
        </p>
        @if (hasWhatsapp()) {
        <a
          class="mt-1 text-sm font-semibold text-white transition-colors hover:text-[#E30613]"
          [href]="whatsappHref()"
          target="_blank"
          rel="noopener noreferrer"
        >
          Asesoría: {{ whatsappDisplay() }}
        </a>
        }
      </div>

      <div class="flex flex-col items-center gap-4 md:items-end">
        <p class="text-sm font-semibold uppercase tracking-wide text-white">
          Síguenos
        </p>
        <div class="flex flex-wrap items-center justify-center gap-3">
          <a
            class="inline-flex size-11 items-center justify-center rounded-full border-2 border-[#E30613] bg-black text-white transition-colors hover:bg-[#E30613]"
            [href]="socialHref('instagram')"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Instagram"
          >
            <svg class="size-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path
                d="M7.8 2h8.4C19.4 2 22 4.6 22 7.8v8.4a5.8 5.8 0 0 1-5.8 5.8H7.8C4.6 22 2 19.4 2 16.2V7.8A5.8 5.8 0 0 1 7.8 2m-.2 2A3.6 3.6 0 0 0 4 7.6v8.8C4 18.39 5.61 20 7.6 20h8.8a3.6 3.6 0 0 0 3.6-3.6V7.6C20 5.61 18.39 4 16.4 4H7.6m9.65 1.5a1.25 1.25 0 0 1 1.25 1.25A1.25 1.25 0 0 1 17.25 8 1.25 1.25 0 0 1 16 6.75a1.25 1.25 0 0 1 1.25-1.25M12 7a5 5 0 0 1 5 5 5 5 0 0 1-5 5 5 5 0 0 1-5-5 5 5 0 0 1 5-5m0 2a3 3 0 0 0-3 3 3 3 0 0 0 3 3 3 3 0 0 0 3-3 3 3 0 0 0-3-3z"
              />
            </svg>
          </a>

          <a
            class="inline-flex size-11 items-center justify-center rounded-full border-2 border-[#E30613] bg-black text-white transition-colors hover:bg-[#E30613]"
            [href]="socialHref('tiktok')"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="TikTok"
          >
            <svg class="size-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path
                d="M16.6 5.82A4.2 4.2 0 0 1 15.32 3h-3.18v12.4a2.6 2.6 0 1 1-1.86-2.5V9.67a5.8 5.8 0 1 0 4.96 5.73V9.4a7.9 7.9 0 0 0 4.56 1.44V7.7a4.24 4.24 0 0 1-3.2-1.88z"
              />
            </svg>
          </a>

          <a
            class="inline-flex size-11 items-center justify-center rounded-full border-2 border-[#E30613] bg-black text-white transition-colors hover:bg-[#E30613]"
            [href]="socialHref('youtube')"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="YouTube"
          >
            <svg class="size-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path
                d="M10 15l5.19-3L10 9v6m11.56-7.83c.13.47.22 1.1.28 1.9.07.8.1 1.49.1 2.09L22 12c0 2.19-.16 3.8-.44 4.83-.25.9-.83 1.48-1.73 1.73-.47.13-1.33.22-2.65.28-1.3.07-2.49.1-3.59.1L12 19c-4.19 0-6.8-.16-7.83-.44-.9-.25-1.48-.83-1.73-1.73-.13-.47-.22-1.1-.28-1.9-.07-.8-.1-1.49-.1-2.09L2 12c0-2.19.16-3.8.44-4.83.25-.9.83-1.48 1.73-1.73.47-.13 1.33-.22 2.65-.28 1.3-.07 2.49-.1 3.59-.1L12 5c4.19 0 6.8.16 7.83.44.9.25 1.48.83 1.73 1.73z"
              />
            </svg>
          </a>

          <a
            class="inline-flex size-11 items-center justify-center rounded-full border-2 border-[#E30613] bg-black text-white transition-colors hover:bg-[#E30613]"
            [href]="socialHref('facebook')"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Facebook"
          >
            <svg class="size-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path
                d="M12 2.04c-5.5 0-10 4.49-10 10.02 0 5 3.66 9.15 8.44 9.9v-7H7.9v-2.9h2.54V9.85c0-2.51 1.49-3.89 3.78-3.89 1.09 0 2.23.19 2.23.19v2.47h-1.26c-1.24 0-1.63.77-1.63 1.56v1.88h2.78l-.45 2.9h-2.33v7a10 10 0 0 0 8.44-9.9c0-5.53-4.5-10.02-10-10.02z"
              />
            </svg>
          </a>

          <a
            class="inline-flex size-11 items-center justify-center rounded-full border-2 border-[#E30613] bg-black text-white transition-colors hover:bg-[#E30613]"
            [class.pointer-events-none]="socialDisabled('whatsapp')"
            [class.opacity-40]="socialDisabled('whatsapp')"
            [href]="socialHref('whatsapp')"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="WhatsApp"
          >
            <svg class="size-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path
                d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2m.01 1.67c2.2 0 4.26.86 5.82 2.42a8.23 8.23 0 0 1 2.41 5.83c0 4.54-3.7 8.23-8.24 8.23-1.48 0-2.93-.39-4.19-1.15l-.3-.17-3.12.82.83-3.04-.2-.32a8.2 8.2 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.25-8.24m-2.7 3.98c-.22-.49-.44-.5-.65-.51h-.55c-.19 0-.5.07-.76.37s-1 1-.1 2.45 1.13 2.46 1.29 2.64c.16.18 2.18 3.33 5.34 4.53 2.64 1 3.18.8 3.75.75.57-.05 1.84-.75 2.1-1.48.26-.73.26-1.35.18-1.48-.07-.13-.27-.21-.57-.36-.3-.16-1.84-.91-2.13-1.01-.29-.1-.49-.15-.7.15-.21.3-.81 1.01-.99 1.22-.18.2-.36.23-.66.08-.3-.15-1.28-.47-2.44-1.5-.9-.8-1.51-1.79-1.69-2.09-.17-.3-.02-.46.13-.61.14-.14.3-.36.45-.54.15-.18.2-.3.3-.5.1-.2.05-.38-.02-.53-.08-.15-.69-1.7-.96-2.32z"
              />
            </svg>
          </a>
        </div>
      </div>
    </div>

    <div
      class="mt-10 flex flex-col items-center justify-between gap-2 border-t border-white/15 pt-6 text-xs text-white/55 sm:flex-row"
    >
      <span>© {{ currentYear }} ALABA Sport. Todos los derechos reservados.</span>
      <a routerLink="/" class="transition-colors hover:text-[#E30613]">Inicio</a>
    </div>
  </div>
</footer>

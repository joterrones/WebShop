<div
  class="relative flex min-h-[70vh] items-center justify-center bg-gradient-to-b from-neutral-950 via-black to-neutral-900 px-4 py-16"
>
  <div
    class="pointer-events-none absolute inset-0 opacity-40"
    style="background-image: radial-gradient(circle at 20% 20%, rgba(227,6,19,0.18), transparent 45%), radial-gradient(circle at 80% 80%, rgba(255,255,255,0.06), transparent 40%);"
  ></div>

  <div class="relative w-full max-w-md">
    <div class="mb-8 text-center">
      <a routerLink="/" class="inline-block">
        <img
          src="/img/alaba-sport-logo.png"
          alt="ALABA Sport"
          class="mx-auto h-14 w-auto object-contain"
        />
      </a>
      <h1 class="mt-4 text-2xl font-bold tracking-wide text-white">
        ALABA Sport
      </h1>
      <p class="mt-1 text-sm text-white/60">Acceso de administrador</p>
    </div>

    <form
      class="space-y-5 border border-white/10 bg-black/60 p-6 backdrop-blur-sm"
      [formGroup]="form"
      (ngSubmit)="onSubmit()"
    >
      <div>
        <label class="mb-1.5 block text-xs font-semibold uppercase tracking-wider text-white/70" for="username">
          Usuario
        </label>
        <input
          id="username"
          type="text"
          formControlName="username"
          autocomplete="username"
          class="w-full border border-white/20 bg-black px-3 py-2.5 text-sm text-white outline-none transition focus:border-[#E30613]"
          placeholder="admin"
        />
      </div>

      <div>
        <label class="mb-1.5 block text-xs font-semibold uppercase tracking-wider text-white/70" for="password">
          Clave
        </label>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          class="w-full border border-white/20 bg-black px-3 py-2.5 text-sm text-white outline-none transition focus:border-[#E30613]"
          placeholder="••••••••"
        />
      </div>

      @if (errorMessage) {
        <p class="text-sm text-[#E30613]">{{ errorMessage }}</p>
      }

      <button
        type="submit"
        class="w-full bg-[#E30613] px-4 py-3 text-sm font-bold uppercase tracking-wide text-white transition hover:bg-[#c00510] disabled:opacity-60"
        [disabled]="submitting"
      >
        {{ submitting ? 'Ingresando…' : 'Ingresar' }}
      </button>
    </form>

    <p class="mt-4 text-center text-sm text-white/50">
      <a routerLink="/" class="hover:text-white">Volver a la tienda</a>
    </p>
  </div>
</div>
